<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <div class="card mx-auto shadow" style="width: 50%;">
        <div class="card-header text-center text-dark fw-bold">ChatterBox</div>
        <div class="card-body">
            <img id="projectImage" class="card-img-top img-fluid" 
                 src="https://via.placeholder.com/600" 
                 alt="Project Image">
        </div>
        <div class="card-footer">
            <p class="date small"><i class="fa-sharp fa-solid fa-calendar-days"></i> July 22, 2024</p>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="imageModalLabel">Project Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center">
                <img id="modalImage" class="img-fluid" alt="Project Image">
                <p id="modalDate" class="mt-3"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-dark" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('projectImage').addEventListener('click', function () {
        const modalImage = document.getElementById('modalImage');
        const modalDate = document.getElementById('modalDate');

        // Set the image source and date for the modal
        modalImage.src = this.src;
        modalDate.textContent = "July 22, 2024"; // Static date for testing

        // Trigger the modal manually
        const modal = new bootstrap.Modal(document.getElementById('imageModal'));
        modal.show();
    });
</script>

</body>
</html>
